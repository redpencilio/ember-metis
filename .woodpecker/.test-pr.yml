steps:
  install:
    image: danlynn/ember-cli:6.11.0
    commands:
      - npm install
  lint-js:
    image: danlynn/ember-cli:6.11.0
    group: lint
    commands:
      - npm run lint:js
  lint-hbs:
    image: danlynn/ember-cli:6.11.0
    group: lint
    commands:
      - npm run lint:hbs
  test:
    image: danlynn/ember-cli:6.11.0
    commands:
      - npm run test:ember
when:
  - event: pull_request
